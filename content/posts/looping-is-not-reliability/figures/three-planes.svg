<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="790" viewBox="0 0 1060 790" role="img" aria-labelledby="title desc">
  <title id="title">Execution, observation, and admission planes</title>
  <desc id="desc">A one-way flow from an agent execution plane to StateSeal's read-only observation plane and then to an external admission plane. StateSeal has no action arrow back to the agent.</desc>
  <rect width="1060" height="790" rx="24" fill="#fafaf8"/>
  <text x="64" y="58" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="700" fill="#171717">Separate the actor, the observer, and the authority</text>
  <text x="64" y="88" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#656565">Information flows downward. Observation never becomes a hidden control loop.</text>

  <rect x="96" y="126" width="710" height="150" rx="18" fill="#fff" stroke="#d7d5cf" stroke-width="2"/>
  <rect x="96" y="126" width="16" height="150" rx="8" fill="#c55a34"/>
  <text x="138" y="163" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5" fill="#a44627">EXECUTION PLANE</text>
  <text x="138" y="197" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700" fill="#222">Agent produces candidate states</text>
  <text x="138" y="229" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#555">propose · edit · run tools · report completion</text>
  <g transform="translate(518 173)" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700">
    <rect x="0" y="0" width="58" height="48" rx="12" fill="#f7e8e1" stroke="#c55a34"/><text x="29" y="30" text-anchor="middle" fill="#8f3f24">S0</text>
    <path d="M66 24 H96" stroke="#999" stroke-width="2"/><path d="M91 18 L99 24 L91 30" fill="none" stroke="#999" stroke-width="2"/>
    <rect x="105" y="0" width="58" height="48" rx="12" fill="#f7e8e1" stroke="#c55a34"/><text x="134" y="30" text-anchor="middle" fill="#8f3f24">S1</text>
    <path d="M171 24 H201" stroke="#999" stroke-width="2"/><path d="M196 18 L204 24 L196 30" fill="none" stroke="#999" stroke-width="2"/>
    <rect x="210" y="0" width="58" height="48" rx="12" fill="#f7e8e1" stroke="#c55a34"/><text x="239" y="30" text-anchor="middle" fill="#8f3f24">S2</text>
  </g>

  <path d="M451 276 V318" stroke="#777" stroke-width="2.5"/>
  <path d="M443 309 L451 321 L459 309" fill="none" stroke="#777" stroke-width="2.5"/>
  <rect x="342" y="287" width="218" height="32" rx="16" fill="#fafaf8"/>
  <text x="451" y="308" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c5c5c">recorded events · no intervention</text>

  <rect x="96" y="324" width="710" height="210" rx="18" fill="#edf6f4" stroke="#4c8e88" stroke-width="2.5"/>
  <rect x="96" y="324" width="16" height="210" rx="8" fill="#246a73"/>
  <text x="138" y="361" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5" fill="#1e626a">OBSERVATION PLANE · STATESEAL</text>
  <text x="138" y="395" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700" fill="#173e42">Reconstructs the delivery chain</text>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">
    <rect x="138" y="424" width="174" height="58" rx="12" fill="#fff" stroke="#9fc3be"/>
    <text x="225" y="448" text-anchor="middle" font-weight="700" fill="#245b60">Normalize</text><text x="225" y="468" text-anchor="middle" fill="#5b6c6d">events + Git + artifacts</text>
    <path d="M320 453 H356" stroke="#5f8783" stroke-width="2"/><path d="M350 447 L358 453 L350 459" fill="none" stroke="#5f8783" stroke-width="2"/>
    <rect x="366" y="424" width="174" height="58" rx="12" fill="#fff" stroke="#9fc3be"/>
    <text x="453" y="448" text-anchor="middle" font-weight="700" fill="#245b60">Correlate</text><text x="453" y="468" text-anchor="middle" fill="#5b6c6d">state ↔ check ↔ time</text>
    <path d="M548 453 H584" stroke="#5f8783" stroke-width="2"/><path d="M578 447 L586 453 L578 459" fill="none" stroke="#5f8783" stroke-width="2"/>
    <rect x="594" y="424" width="174" height="58" rx="12" fill="#fff" stroke="#9fc3be"/>
    <text x="681" y="448" text-anchor="middle" font-weight="700" fill="#245b60">Explain</text><text x="681" y="468" text-anchor="middle" fill="#5b6c6d">freshness + gaps + audit</text>
  </g>
  <text x="138" y="512" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#3b6768">Evidence grades: Observed · Derived · Inferred</text>

  <path d="M451 534 V578" stroke="#777" stroke-width="2.5"/>
  <path d="M443 569 L451 581 L459 569" fill="none" stroke="#777" stroke-width="2.5"/>
  <rect x="349" y="546" width="204" height="32" rx="16" fill="#fafaf8"/>
  <text x="451" y="567" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5c5c5c">evidence for an explicit decision</text>

  <rect x="96" y="584" width="710" height="146" rx="18" fill="#fff" stroke="#d7d5cf" stroke-width="2"/>
  <rect x="96" y="584" width="16" height="146" rx="8" fill="#7857a4"/>
  <text x="138" y="621" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5" fill="#65458f">ADMISSION PLANE</text>
  <text x="138" y="655" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700" fill="#28212f">Authorized systems decide delivery</text>
  <text x="138" y="688" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#5b5561">user · protected CI · deployment policy · domain approval</text>

  <rect x="840" y="324" width="164" height="210" rx="16" fill="#fff" stroke="#cfcfc9" stroke-dasharray="6 5"/>
  <text x="922" y="360" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#555">BOUNDARY</text>
  <line x1="866" y1="378" x2="978" y2="378" stroke="#ddd"/>
  <text x="922" y="409" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#555">read-only</text>
  <text x="922" y="438" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#555">local</text>
  <text x="922" y="467" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#555">GET-only UI</text>
  <text x="922" y="504" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#8b4b3d">no approve / block</text>
</svg>
