<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Current correctness falls while ever-correct rises</title>
  <desc id="desc">Line chart for the current-trace arm over three forced revisions. Current correctness is 82.0, 67.3, and 69.3 percent. Ever-correct is 82.0, 84.7, and 85.3 percent.</desc>
  <rect width="1000" height="560" rx="22" fill="#fbfbfa"/>
  <text x="72" y="62" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="29" font-weight="700" fill="#171717">Discovery rises while the held state regresses</text>
  <text x="72" y="94" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#646464">Current-trace condition · 150 trajectories · three forced revisions</text>

  <g stroke="#dededb" stroke-width="1">
    <line x1="128" y1="420" x2="900" y2="420"/>
    <line x1="128" y1="356" x2="900" y2="356"/>
    <line x1="128" y1="292" x2="900" y2="292"/>
    <line x1="128" y1="228" x2="900" y2="228"/>
    <line x1="128" y1="164" x2="900" y2="164"/>
  </g>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#666">
    <text x="82" y="425">65%</text>
    <text x="82" y="361">70%</text>
    <text x="82" y="297">75%</text>
    <text x="82" y="233">80%</text>
    <text x="82" y="169">85%</text>
    <text x="252" y="464">Revision 1</text>
    <text x="479" y="464">Revision 2</text>
    <text x="706" y="464">Revision 3</text>
  </g>
  <g stroke="#9b9b96" stroke-width="1.5">
    <line x1="128" y1="126" x2="128" y2="420"/>
    <line x1="128" y1="420" x2="900" y2="420"/>
  </g>

  <path d="M300 202 L527 389 L754 363" fill="none" stroke="#c55a34" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M300 202 L527 168 L754 160" fill="none" stroke="#246a73" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M527 168 L754 160 L754 363 L527 389 Z" fill="#e9b28b" opacity="0.18"/>

  <g fill="#c55a34" stroke="#fbfbfa" stroke-width="4">
    <circle cx="300" cy="202" r="9"/>
    <circle cx="527" cy="389" r="9"/>
    <circle cx="754" cy="363" r="9"/>
  </g>
  <g fill="#246a73" stroke="#fbfbfa" stroke-width="4">
    <circle cx="300" cy="202" r="9"/>
    <circle cx="527" cy="168" r="9"/>
    <circle cx="754" cy="160" r="9"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650">
    <text x="272" y="187" fill="#353535">82.0%</text>
    <text x="500" y="151" fill="#246a73">84.7%</text>
    <text x="728" y="143" fill="#246a73">85.3%</text>
    <text x="500" y="416" fill="#c55a34">67.3%</text>
    <text x="728" y="390" fill="#c55a34">69.3%</text>
  </g>

  <line x1="790" y1="160" x2="790" y2="363" stroke="#8f644a" stroke-width="2" stroke-dasharray="5 5"/>
  <path d="M784 168 L790 158 L796 168 M784 355 L790 365 L796 355" fill="none" stroke="#8f644a" stroke-width="2"/>
  <rect x="804" y="238" width="138" height="52" rx="10" fill="#fff" stroke="#d9c2b3"/>
  <text x="873" y="260" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#75482f">16.0 pp</text>
  <text x="873" y="279" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#75482f">found, then lost</text>

  <g transform="translate(196 514)" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">
    <line x1="0" y1="0" x2="35" y2="0" stroke="#246a73" stroke-width="5"/>
    <text x="45" y="5" fill="#333">Ever-correct (cumulative discovery)</text>
    <line x1="344" y1="0" x2="379" y2="0" stroke="#c55a34" stroke-width="5"/>
    <text x="389" y="5" fill="#333">Current correctness (held state)</text>
  </g>
</svg>
