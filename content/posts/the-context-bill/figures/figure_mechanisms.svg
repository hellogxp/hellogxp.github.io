<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 486" width="780" height="486" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="780" height="486" fill="#ffffff"/>
  <defs>
    <marker id="arrowSolid" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#4C72B0"/>
    </marker>
    <marker id="arrowDash" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#C44E52"/>
    </marker>
  </defs>

  <text x="390" y="32" text-anchor="middle" font-size="20" font-weight="600" fill="#2C3E50">Three independent mechanisms, one conclusion</text>

  <!-- box 1 -->
  <rect x="20" y="56" width="230" height="140" rx="8" fill="#4C72B0" fill-opacity="0.10" stroke="#4C72B0" stroke-width="1.5"/>
  <text x="135" y="80" text-anchor="middle" font-size="16" font-weight="600" fill="#2C3E50">Softmax must disperse</text>
  <text x="135" y="100" text-anchor="middle" font-size="11" font-weight="600" fill="#4C72B0">proved — a theorem</text>
  <text x="36" y="124" font-size="11" fill="#2C3E50">Any learned attention circuitry</text>
  <text x="36" y="141" font-size="11" fill="#2C3E50">must disperse as item count</text>
  <text x="36" y="158" font-size="11" fill="#2C3E50">grows: the denominator grows</text>
  <text x="36" y="175" font-size="11" fill="#2C3E50">with it.</text>
  <text x="135" y="190" text-anchor="middle" font-size="10" fill="#8C8C8C">Veličković et al. 2025 · asymptotic</text>

  <!-- box 2 -->
  <rect x="275" y="56" width="230" height="140" rx="8" fill="#4C72B0" fill-opacity="0.10" stroke="#4C72B0" stroke-width="1.5"/>
  <text x="390" y="80" text-anchor="middle" font-size="16" font-weight="600" fill="#2C3E50">Position bias is baked in</text>
  <text x="390" y="100" text-anchor="middle" font-size="11" font-weight="600" fill="#4C72B0">proved + calibrated away</text>
  <text x="291" y="124" font-size="11" fill="#2C3E50">U-shaped bias regardless of</text>
  <text x="291" y="141" font-size="11" fill="#2C3E50">relevance; causal masking is</text>
  <text x="291" y="158" font-size="11" fill="#2C3E50">the cause, not RoPE. Removing</text>
  <text x="291" y="175" font-size="11" fill="#2C3E50">it gains up to 15pp.</text>
  <text x="390" y="190" text-anchor="middle" font-size="10" fill="#8C8C8C">Hsieh et al. 2024 · Wu et al. 2025</text>

  <!-- box 3 -->
  <rect x="530" y="56" width="230" height="140" rx="8" fill="#4C72B0" fill-opacity="0.10" stroke="#4C72B0" stroke-width="1.5"/>
  <text x="645" y="80" text-anchor="middle" font-size="16" font-weight="600" fill="#2C3E50">Presence raises logits</text>
  <text x="645" y="100" text-anchor="middle" font-size="11" font-weight="600" fill="#4C72B0">causal — verified by ablation</text>
  <text x="546" y="124" font-size="11" fill="#2C3E50">Any token that appeared gets</text>
  <text x="546" y="141" font-size="11" fill="#2C3E50">higher logits — even random</text>
  <text x="546" y="158" font-size="11" fill="#2C3E50">ones. Zeroing 2–4% of heads</text>
  <text x="546" y="175" font-size="11" fill="#2C3E50">attenuates the effect.</text>
  <text x="645" y="190" text-anchor="middle" font-size="10" fill="#8C8C8C">Niu et al. 2025 · Liu &amp; Chu 2026</text>

  <!-- the missing step -->
  <rect x="20" y="222" width="230" height="52" rx="8" fill="#C44E52" fill-opacity="0.08" stroke="#C44E52" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="135" y="243" text-anchor="middle" font-size="11" font-weight="600" fill="#C44E52">entropy rises as context fills</text>
  <text x="135" y="261" text-anchor="middle" font-size="10" fill="#C44E52">not measured on a frontier model</text>
  <line x1="135" y1="196" x2="135" y2="220" stroke="#C44E52" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowDash)"/>
  <line x1="135" y1="274" x2="135" y2="316" stroke="#C44E52" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowDash)"/>

  <line x1="390" y1="196" x2="390" y2="316" stroke="#4C72B0" stroke-width="1.5" marker-end="url(#arrowSolid)"/>
  <line x1="645" y1="196" x2="645" y2="316" stroke="#4C72B0" stroke-width="1.5" marker-end="url(#arrowSolid)"/>

  <!-- conclusion -->
  <rect x="90" y="320" width="600" height="62" rx="8" fill="#2C3E50" fill-opacity="0.09" stroke="#2C3E50" stroke-width="1.5"/>
  <text x="390" y="348" text-anchor="middle" font-size="18" font-weight="700" fill="#2C3E50">Presence is the charge</text>
  <text x="390" y="370" text-anchor="middle" font-size="12" fill="#2C3E50">Resident context is billed whether or not this turn uses it — so treat it as rented, not owned.</text>

  <!-- not a mechanism -->
  <rect x="90" y="400" width="600" height="70" rx="8" fill="#8C8C8C" fill-opacity="0.10" stroke="#8C8C8C" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="390" y="421" text-anchor="middle" font-size="12" font-weight="600" fill="#2C3E50">Not a mechanism: instruction count</text>
  <text x="390" y="441" text-anchor="middle" font-size="11" fill="#2C3E50">IFScale and its successors measure the decay precisely and explain none of it.</text>
  <text x="390" y="459" text-anchor="middle" font-size="11" fill="#2C3E50">A scaling law to plan around, not a cause.</text>
</svg>
