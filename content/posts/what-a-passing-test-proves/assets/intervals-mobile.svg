<svg xmlns="http://www.w3.org/2000/svg" width="360" height="833" viewBox="0 0 360 833" role="img"><title>intervals</title><rect width="100%" height="100%" fill="#FFFFFF"/><g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="24" y="35" font-size="21" fill="#2C3E50" font-weight="600" text-anchor="start">A result has an interval</text><text x="24" y="74.45" font-size="15" fill="#687583" font-weight="400" text-anchor="start">An observation supports only the</text><text x="24" y="96.2" font-size="15" fill="#687583" font-weight="400" text-anchor="start">obligation it actually spans.</text><line x1="24.0" y1="139.95" x2="336.0" y2="139.95" stroke="#4C72B0" stroke-width="1.5" stroke-dasharray=""/><text x="24.0" y="167.95" font-size="18" fill="#2C3E50" font-weight="600" text-anchor="start">Live call versus cleanup</text><text x="24.0" y="208.04999999999998" font-size="14" fill="#4C72B0" font-weight="600" text-anchor="start">01</text><text x="56.0" y="208.04999999999998" font-size="17" fill="#2C3E50" font-weight="500" text-anchor="start">Write, then reset history</text><text x="56.0" y="234.7" font-size="15" fill="#687583" font-weight="400" text-anchor="start">Earlier events no longer count.</text><text x="24.0" y="273.45" font-size="14" fill="#4C72B0" font-weight="600" text-anchor="start">02</text><text x="56.0" y="273.45" font-size="17" fill="#2C3E50" font-weight="500" text-anchor="start">Invoke explicit flush</text><text x="56.0" y="300.09999999999997" font-size="15" fill="#687583" font-weight="400" text-anchor="start">Observe before return completes.</text><text x="24.0" y="338.84999999999997" font-size="14" fill="#4C72B0" font-weight="600" text-anchor="start">03</text><text x="56.0" y="338.84999999999997" font-size="17" fill="#2C3E50" font-weight="500" text-anchor="start">Later object cleanup</text><text x="56.0" y="365.49999999999994" font-size="15" fill="#687583" font-weight="400" text-anchor="start">Belongs to a different obligation.</text><text x="24.0" y="410.24999999999994" font-size="16" fill="#4C72B0" font-weight="500" text-anchor="start">Hold the wrapper alive through the</text><text x="24.0" y="433.44999999999993" font-size="16" fill="#4C72B0" font-weight="500" text-anchor="start">live-call assertion.</text><line x1="24.0" y1="486.6499999999999" x2="336.0" y2="486.6499999999999" stroke="#4C72B0" stroke-width="1.5" stroke-dasharray=""/><text x="24.0" y="514.6499999999999" font-size="18" fill="#2C3E50" font-weight="600" text-anchor="start">Admission versus shutdown</text><text x="24.0" y="554.7499999999999" font-size="14" fill="#4C72B0" font-weight="600" text-anchor="start">01</text><text x="56.0" y="554.7499999999999" font-size="17" fill="#2C3E50" font-weight="500" text-anchor="start">Spawner reads open</text><text x="56.0" y="581.3999999999999" font-size="15" fill="#687583" font-weight="400" text-anchor="start">Work is not registered yet.</text><text x="24.0" y="620.1499999999999" font-size="14" fill="#4C72B0" font-weight="600" text-anchor="start">02</text><text x="56.0" y="620.1499999999999" font-size="17" fill="#2C3E50" font-weight="500" text-anchor="start">Shutdown sees empty</text><text x="56.0" y="646.7999999999998" font-size="15" fill="#687583" font-weight="400" text-anchor="start">Returns while the spawner pauses.</text><text x="24.0" y="685.5499999999998" font-size="14" fill="#4C72B0" font-weight="600" text-anchor="start">03</text><text x="56.0" y="685.5499999999998" font-size="17" fill="#2C3E50" font-weight="500" text-anchor="start">Spawner resumes</text><text x="56.0" y="712.1999999999998" font-size="15" fill="#687583" font-weight="400" text-anchor="start">Registers and starts purging.</text><text x="24.0" y="756.9499999999998" font-size="16" fill="#4C72B0" font-weight="500" text-anchor="start">Reserve before checking closure;</text><text x="24.0" y="780.1499999999999" font-size="16" fill="#4C72B0" font-weight="500" text-anchor="start">retain through the work.</text></g></svg>