<svg xmlns="http://www.w3.org/2000/svg" width="760" height="472" viewBox="0 0 760 472" role="img"><title>completion gate</title><rect width="100%" height="100%" fill="#FFFFFF"/><g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="24" y="35" font-size="26" fill="#2C3E50" font-weight="600" text-anchor="start">Bind the completion claim</text><text x="24" y="81.69999999999999" font-size="15" fill="#687583" font-weight="400" text-anchor="start">A minimal design recommendation, not a universal correctness test.</text><line x1="24.0" y1="125.44999999999999" x2="360.0" y2="125.44999999999999" stroke="#4C72B0" stroke-width="1.5" stroke-dasharray=""/><text x="24.0" y="153.45" font-size="18" fill="#2C3E50" font-weight="600" text-anchor="start">Establish the observation</text><text x="24.0" y="193.54999999999998" font-size="14" fill="#4C72B0" font-weight="600" text-anchor="start">01</text><text x="56.0" y="193.54999999999998" font-size="17" fill="#2C3E50" font-weight="500" text-anchor="start">Bind the final revision</text><text x="56.0" y="220.2" font-size="15" fill="#687583" font-weight="400" text-anchor="start">Stale receipts do not qualify.</text><text x="24.0" y="258.95" font-size="14" fill="#4C72B0" font-weight="600" text-anchor="start">02</text><text x="56.0" y="258.95" font-size="17" fill="#2C3E50" font-weight="500" text-anchor="start">Establish target entry</text><text x="56.0" y="285.59999999999997" font-size="15" fill="#687583" font-weight="400" text-anchor="start">Startup errors remain UNKNOWN.</text><text x="24.0" y="324.34999999999997" font-size="14" fill="#4C72B0" font-weight="600" text-anchor="start">03</text><text x="56.0" y="324.34999999999997" font-size="17" fill="#2C3E50" font-weight="500" text-anchor="start">Identify the invocation</text><text x="56.0" y="350.99999999999994" font-size="15" fill="#687583" font-weight="400" text-anchor="start">A shared name is insufficient.</text><text x="24.0" y="395.74999999999994" font-size="16" fill="#4C72B0" font-weight="500" text-anchor="start">Missing facts → retain uncertainty.</text><line x1="400.0" y1="125.44999999999999" x2="736.0" y2="125.44999999999999" stroke="#4C72B0" stroke-width="1.5" stroke-dasharray=""/><text x="400.0" y="153.45" font-size="18" fill="#2C3E50" font-weight="600" text-anchor="start">Evaluate the obligation</text><text x="400.0" y="193.54999999999998" font-size="14" fill="#4C72B0" font-weight="600" text-anchor="start">01</text><text x="432.0" y="193.54999999999998" font-size="17" fill="#2C3E50" font-weight="500" text-anchor="start">Check operation and interval</text><text x="432.0" y="220.2" font-size="15" fill="#687583" font-weight="400" text-anchor="start">Attribute the event or consumption.</text><text x="400.0" y="258.95" font-size="14" fill="#4C72B0" font-weight="600" text-anchor="start">02</text><text x="432.0" y="258.95" font-size="17" fill="#2C3E50" font-weight="500" text-anchor="start">Preserve context identity</text><text x="432.0" y="285.59999999999997" font-size="15" fill="#687583" font-weight="400" text-anchor="start">A rescued run is diagnostic only.</text><text x="400.0" y="324.34999999999997" font-size="14" fill="#4C72B0" font-weight="600" text-anchor="start">03</text><text x="432.0" y="324.34999999999997" font-size="17" fill="#2C3E50" font-weight="500" text-anchor="start">Report the tested scope</text><text x="432.0" y="350.99999999999994" font-size="15" fill="#687583" font-weight="400" text-anchor="start">Keep other obligations visible.</text><text x="400.0" y="395.74999999999994" font-size="16" fill="#4C72B0" font-weight="500" text-anchor="start">Supported facts → a bounded</text><text x="400.0" y="418.94999999999993" font-size="16" fill="#4C72B0" font-weight="500" text-anchor="start">conclusion.</text></g></svg>