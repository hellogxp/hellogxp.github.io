<svg xmlns="http://www.w3.org/2000/svg" width="760" height="472" viewBox="0 0 760 472" role="img"><title>flush origin</title><rect width="100%" height="100%" fill="#FFFFFF"/><g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="24" y="35" font-size="26" fill="#2C3E50" font-weight="600" text-anchor="start">Locate the positive event</text><text x="24" y="81.69999999999999" font-size="15" fill="#687583" font-weight="400" text-anchor="start">Schematic live-call sequence; cleanup is a separate channel.</text><line x1="24.0" y1="125.44999999999999" x2="360.0" y2="125.44999999999999" stroke="#4C72B0" stroke-width="1.5" stroke-dasharray=""/><text x="24.0" y="153.45" font-size="18" fill="#2C3E50" font-weight="600" text-anchor="start">Observed Qwen patch</text><text x="24.0" y="193.54999999999998" font-size="14" fill="#4C72B0" font-weight="600" text-anchor="start">01</text><text x="56.0" y="193.54999999999998" font-size="17" fill="#2C3E50" font-weight="500" text-anchor="start">write(&quot;Working...&quot;)</text><text x="56.0" y="220.2" font-size="15" fill="#687583" font-weight="400" text-anchor="start">Underlying flush event.</text><text x="24.0" y="258.95" font-size="14" fill="#4C72B0" font-weight="600" text-anchor="start">02</text><text x="56.0" y="258.95" font-size="17" fill="#2C3E50" font-weight="500" text-anchor="start">flush()</text><text x="56.0" y="285.59999999999997" font-size="15" fill="#687583" font-weight="400" text-anchor="start">No forwarding event.</text><text x="24.0" y="324.34999999999997" font-size="14" fill="#4C72B0" font-weight="600" text-anchor="start">03</text><text x="56.0" y="324.34999999999997" font-size="17" fill="#2C3E50" font-weight="500" text-anchor="start">write(&quot;OK&quot;)</text><text x="56.0" y="350.99999999999994" font-size="15" fill="#687583" font-weight="400" text-anchor="start">Underlying flush event.</text><text x="24.0" y="395.74999999999994" font-size="16" fill="#4C72B0" font-weight="500" text-anchor="start">Original boolean: PASS. Explicit</text><text x="24.0" y="418.94999999999993" font-size="16" fill="#4C72B0" font-weight="500" text-anchor="start">forwarding: FAIL.</text><line x1="400.0" y1="125.44999999999999" x2="736.0" y2="125.44999999999999" stroke="#4C72B0" stroke-width="1.5" stroke-dasharray=""/><text x="400.0" y="153.45" font-size="18" fill="#2C3E50" font-weight="600" text-anchor="start">Official repair</text><text x="400.0" y="193.54999999999998" font-size="14" fill="#4C72B0" font-weight="600" text-anchor="start">01</text><text x="432.0" y="193.54999999999998" font-size="17" fill="#2C3E50" font-weight="500" text-anchor="start">write(&quot;Working...&quot;)</text><text x="432.0" y="220.2" font-size="15" fill="#687583" font-weight="400" text-anchor="start">No write-side flush event.</text><text x="400.0" y="258.95" font-size="14" fill="#4C72B0" font-weight="600" text-anchor="start">02</text><text x="432.0" y="258.95" font-size="17" fill="#2C3E50" font-weight="500" text-anchor="start">flush()</text><text x="432.0" y="285.59999999999997" font-size="15" fill="#687583" font-weight="400" text-anchor="start">Underlying flush event.</text><text x="400.0" y="324.34999999999997" font-size="14" fill="#4C72B0" font-weight="600" text-anchor="start">03</text><text x="432.0" y="324.34999999999997" font-size="17" fill="#2C3E50" font-weight="500" text-anchor="start">write(&quot;OK&quot;)</text><text x="432.0" y="350.99999999999994" font-size="15" fill="#687583" font-weight="400" text-anchor="start">No write-side flush event.</text><text x="400.0" y="395.74999999999994" font-size="16" fill="#4C72B0" font-weight="500" text-anchor="start">Original boolean: PASS. Explicit</text><text x="400.0" y="418.94999999999993" font-size="16" fill="#4C72B0" font-weight="500" text-anchor="start">forwarding: PASS.</text></g></svg>