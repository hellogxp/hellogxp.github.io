<svg xmlns="http://www.w3.org/2000/svg" width="360" height="831" viewBox="0 0 360 831" role="img"><title>completion gate</title><rect width="100%" height="100%" fill="#FFFFFF"/><g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="24" y="35" font-size="21" fill="#2C3E50" font-weight="600" text-anchor="start">Bind the completion claim</text><text x="24" y="74.45" font-size="15" fill="#687583" font-weight="400" text-anchor="start">A minimal design recommendation, not a</text><text x="24" y="96.2" font-size="15" fill="#687583" font-weight="400" text-anchor="start">universal correctness test.</text><line x1="24.0" y1="139.95" x2="336.0" y2="139.95" stroke="#4C72B0" stroke-width="1.5" stroke-dasharray=""/><text x="24.0" y="167.95" font-size="18" fill="#2C3E50" font-weight="600" text-anchor="start">Establish the observation</text><text x="24.0" y="208.04999999999998" font-size="14" fill="#4C72B0" font-weight="600" text-anchor="start">01</text><text x="56.0" y="208.04999999999998" font-size="17" fill="#2C3E50" font-weight="500" text-anchor="start">Bind the final revision</text><text x="56.0" y="234.7" font-size="15" fill="#687583" font-weight="400" text-anchor="start">Stale receipts do not qualify.</text><text x="24.0" y="273.45" font-size="14" fill="#4C72B0" font-weight="600" text-anchor="start">02</text><text x="56.0" y="273.45" font-size="17" fill="#2C3E50" font-weight="500" text-anchor="start">Establish target entry</text><text x="56.0" y="300.09999999999997" font-size="15" fill="#687583" font-weight="400" text-anchor="start">Startup errors remain UNKNOWN.</text><text x="24.0" y="338.84999999999997" font-size="14" fill="#4C72B0" font-weight="600" text-anchor="start">03</text><text x="56.0" y="338.84999999999997" font-size="17" fill="#2C3E50" font-weight="500" text-anchor="start">Identify the invocation</text><text x="56.0" y="365.49999999999994" font-size="15" fill="#687583" font-weight="400" text-anchor="start">A shared name is insufficient.</text><text x="24.0" y="410.24999999999994" font-size="16" fill="#4C72B0" font-weight="500" text-anchor="start">Missing facts → retain uncertainty.</text><line x1="24.0" y1="463.44999999999993" x2="336.0" y2="463.44999999999993" stroke="#4C72B0" stroke-width="1.5" stroke-dasharray=""/><text x="24.0" y="491.44999999999993" font-size="18" fill="#2C3E50" font-weight="600" text-anchor="start">Evaluate the obligation</text><text x="24.0" y="531.55" font-size="14" fill="#4C72B0" font-weight="600" text-anchor="start">01</text><text x="56.0" y="531.55" font-size="17" fill="#2C3E50" font-weight="500" text-anchor="start">Check operation and interval</text><text x="56.0" y="558.1999999999999" font-size="15" fill="#687583" font-weight="400" text-anchor="start">Attribute the event or</text><text x="56.0" y="579.9499999999999" font-size="15" fill="#687583" font-weight="400" text-anchor="start">consumption.</text><text x="24.0" y="618.6999999999999" font-size="14" fill="#4C72B0" font-weight="600" text-anchor="start">02</text><text x="56.0" y="618.6999999999999" font-size="17" fill="#2C3E50" font-weight="500" text-anchor="start">Preserve context identity</text><text x="56.0" y="645.3499999999999" font-size="15" fill="#687583" font-weight="400" text-anchor="start">A rescued run is diagnostic only.</text><text x="24.0" y="684.0999999999999" font-size="14" fill="#4C72B0" font-weight="600" text-anchor="start">03</text><text x="56.0" y="684.0999999999999" font-size="17" fill="#2C3E50" font-weight="500" text-anchor="start">Report the tested scope</text><text x="56.0" y="710.7499999999999" font-size="15" fill="#687583" font-weight="400" text-anchor="start">Keep other obligations visible.</text><text x="24.0" y="755.4999999999999" font-size="16" fill="#4C72B0" font-weight="500" text-anchor="start">Supported facts → a bounded</text><text x="24.0" y="778.6999999999999" font-size="16" fill="#4C72B0" font-weight="500" text-anchor="start">conclusion.</text></g></svg>