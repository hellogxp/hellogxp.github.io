<svg xmlns="http://www.w3.org/2000/svg" width="760" height="524" viewBox="0 0 760 524" role="img"><title>evidence path</title><rect width="100%" height="100%" fill="#FFFFFF"/><g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="24" y="35" font-size="26" fill="#2C3E50" font-weight="600" text-anchor="start">One edit, two effects</text><text x="24" y="81.69999999999999" font-size="15" fill="#687583" font-weight="400" text-anchor="start">The implementation also participates in producing its own evidence.</text><rect x="24" y="125.44999999999999" width="712" height="78" rx="5" fill="#F5F8FB" stroke="#D8DFE5"/><text x="380.0" y="155.45" font-size="17" fill="#4C72B0" font-weight="600" text-anchor="middle">Production edit</text><text x="380.0" y="181.45" font-size="15" fill="#687583" font-weight="400" text-anchor="middle">Add underlying flush to write()</text><line x1="380.0" y1="203.45" x2="380.0" y2="223.45" stroke="#4C72B0" stroke-width="1.5" stroke-dasharray=""/><line x1="380.0" y1="223.45" x2="191.0" y2="223.45" stroke="#4C72B0" stroke-width="1.5" stroke-dasharray=""/><line x1="191.0" y1="223.45" x2="191.0" y2="247.45" stroke="#4C72B0" stroke-width="1.5" stroke-dasharray=""/><path d="M187.0,246.45 L191.0,252.45 L195.0,246.45" fill="none" stroke="#4C72B0" stroke-width="1.5"/><line x1="380.0" y1="203.45" x2="380.0" y2="223.45" stroke="#4C72B0" stroke-width="1.5" stroke-dasharray=""/><line x1="380.0" y1="223.45" x2="569.0" y2="223.45" stroke="#4C72B0" stroke-width="1.5" stroke-dasharray=""/><line x1="569.0" y1="223.45" x2="569.0" y2="247.45" stroke="#4C72B0" stroke-width="1.5" stroke-dasharray=""/><path d="M565.0,246.45 L569.0,252.45 L573.0,246.45" fill="none" stroke="#4C72B0" stroke-width="1.5"/><rect x="24" y="252.45" width="334" height="78" rx="5" fill="#F5F8FB" stroke="#D8DFE5"/><text x="191.0" y="282.45" font-size="17" fill="#B85A5A" font-weight="600" text-anchor="middle">Requested operation</text><text x="191.0" y="308.45" font-size="15" fill="#687583" font-weight="400" text-anchor="middle">Explicit flush remains ineffective</text><rect x="402" y="252.45" width="334" height="78" rx="5" fill="#F5F8FB" stroke="#D8DFE5"/><text x="569.0" y="282.45" font-size="17" fill="#4C72B0" font-weight="600" text-anchor="middle">Observed witness</text><text x="569.0" y="308.45" font-size="15" fill="#687583" font-weight="400" text-anchor="middle">Writes produce flush events</text><line x1="569.0" y1="330.45" x2="569.0" y2="362.45" stroke="#4C72B0" stroke-width="1.5" stroke-dasharray=""/><path d="M565.0,361.45 L569.0,367.45 L573.0,361.45" fill="none" stroke="#4C72B0" stroke-width="1.5"/><rect x="402" y="367.45" width="334" height="78" rx="5" fill="#F5F8FB" stroke="#D8DFE5"/><text x="569.0" y="397.45" font-size="17" fill="#4C72B0" font-weight="600" text-anchor="middle">Unchanged assertion</text><text x="569.0" y="423.45" font-size="15" fill="#687583" font-weight="400" text-anchor="middle">A flush happened: PASS</text><line x1="191.0" y1="330.45" x2="191.0" y2="410.45" stroke="#B85A5A" stroke-width="1.5" stroke-dasharray="5,5"/><text x="191.0" y="441.45" font-size="16" fill="#B85A5A" font-weight="500" text-anchor="middle">No live-forwarding evidence</text><text x="24" y="486.45" font-size="16" fill="#4C72B0" font-weight="500" text-anchor="start">A true observation does not automatically establish the requested operation.</text></g></svg>