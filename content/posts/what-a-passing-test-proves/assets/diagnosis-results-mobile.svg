<svg xmlns="http://www.w3.org/2000/svg" width="360" height="888" viewBox="0 0 360 888" role="img"><title>diagnosis results</title><rect width="100%" height="100%" fill="#FFFFFF"/><g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="24" y="35" font-size="21" fill="#2C3E50" font-weight="600" text-anchor="start">Utility depends on the</text><text x="24" y="65.45" font-size="21" fill="#2C3E50" font-weight="600" text-anchor="start">endpoint</text><text x="24" y="104.9" font-size="15" fill="#687583" font-weight="400" text-anchor="start">Selected-task repair and fresh-task</text><text x="24" y="126.65" font-size="15" fill="#687583" font-weight="400" text-anchor="start">diagnosis are separate experiments.</text><line x1="24.0" y1="170.4" x2="336.0" y2="170.4" stroke="#4C72B0" stroke-width="1.5" stroke-dasharray=""/><text x="24.0" y="198.4" font-size="18" fill="#2C3E50" font-weight="600" text-anchor="start">Selected-task repairs</text><text x="24.0" y="226.5" font-size="15" fill="#687583" font-weight="400" text-anchor="start">Two tasks, two seeds each.</text><text x="24.0" y="264.25" font-size="16" fill="#2C3E50" font-weight="400" text-anchor="start">Repair section only</text><text x="336.0" y="264.25" font-size="16" fill="#4C72B0" font-weight="600" text-anchor="end">4/4</text><line x1="29.0" y1="284.25" x2="331.0" y2="284.25" stroke="#D8DFE5" stroke-width="1.5" stroke-dasharray=""/><circle cx="331.0" cy="284.25" r="4.5" fill="#4C72B0"/><text x="24.0" y="322.25" font-size="16" fill="#2C3E50" font-weight="400" text-anchor="start">Full note</text><text x="336.0" y="322.25" font-size="16" fill="#4C72B0" font-weight="600" text-anchor="end">1/4</text><line x1="29.0" y1="342.25" x2="331.0" y2="342.25" stroke="#D8DFE5" stroke-width="1.5" stroke-dasharray=""/><circle cx="104.5" cy="342.25" r="4.5" fill="#4C72B0"/><text x="24.0" y="380.25" font-size="16" fill="#2C3E50" font-weight="400" text-anchor="start">No note</text><text x="336.0" y="380.25" font-size="16" fill="#4C72B0" font-weight="600" text-anchor="end">0/4</text><line x1="29.0" y1="400.25" x2="331.0" y2="400.25" stroke="#D8DFE5" stroke-width="1.5" stroke-dasharray=""/><circle cx="29.0" cy="400.25" r="4.5" fill="#4C72B0"/><line x1="24.0" y1="456.25" x2="336.0" y2="456.25" stroke="#4C72B0" stroke-width="1.5" stroke-dasharray=""/><text x="24.0" y="484.25" font-size="18" fill="#2C3E50" font-weight="600" text-anchor="start">Fresh-task decisions</text><text x="24.0" y="512.35" font-size="15" fill="#687583" font-weight="400" text-anchor="start">Four tasks, two seeds each.</text><text x="24.0" y="550.1" font-size="16" fill="#2C3E50" font-weight="400" text-anchor="start">Ordinary: choice</text><text x="336.0" y="550.1" font-size="16" fill="#4C72B0" font-weight="600" text-anchor="end">6/8</text><line x1="29.0" y1="570.1" x2="331.0" y2="570.1" stroke="#D8DFE5" stroke-width="1.5" stroke-dasharray=""/><circle cx="255.5" cy="570.1" r="4.5" fill="#4C72B0"/><text x="24.0" y="608.1" font-size="16" fill="#2C3E50" font-weight="400" text-anchor="start">Scoped: choice</text><text x="336.0" y="608.1" font-size="16" fill="#4C72B0" font-weight="600" text-anchor="end">6/8</text><line x1="29.0" y1="628.1" x2="331.0" y2="628.1" stroke="#D8DFE5" stroke-width="1.5" stroke-dasharray=""/><circle cx="255.5" cy="628.1" r="4.5" fill="#4C72B0"/><text x="24.0" y="666.1" font-size="16" fill="#2C3E50" font-weight="400" text-anchor="start">Ordinary: joint</text><text x="336.0" y="666.1" font-size="16" fill="#4C72B0" font-weight="600" text-anchor="end">3/8</text><line x1="29.0" y1="686.1" x2="331.0" y2="686.1" stroke="#D8DFE5" stroke-width="1.5" stroke-dasharray=""/><circle cx="142.25" cy="686.1" r="4.5" fill="#4C72B0"/><text x="24.0" y="724.1" font-size="16" fill="#2C3E50" font-weight="400" text-anchor="start">Scoped: joint</text><text x="336.0" y="724.1" font-size="16" fill="#4C72B0" font-weight="600" text-anchor="end">0/8</text><line x1="29.0" y1="744.1" x2="331.0" y2="744.1" stroke="#D8DFE5" stroke-width="1.5" stroke-dasharray=""/><circle cx="29.0" cy="744.1" r="4.5" fill="#4C72B0"/><text x="24" y="808.1" font-size="15" fill="#687583" font-weight="400" text-anchor="start">Joint = qualified choice AND all</text><text x="24" y="829.85" font-size="15" fill="#687583" font-weight="400" text-anchor="start">outcome predictions correct. Compare</text><text x="24" y="851.6" font-size="15" fill="#687583" font-weight="400" text-anchor="start">within each experiment.</text></g></svg>