<svg xmlns="http://www.w3.org/2000/svg" width="360" height="687" viewBox="0 0 360 687" role="img"><title>evidence path</title><rect width="100%" height="100%" fill="#FFFFFF"/><g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="24" y="35" font-size="21" fill="#2C3E50" font-weight="600" text-anchor="start">One edit, two effects</text><text x="24" y="74.45" font-size="15" fill="#687583" font-weight="400" text-anchor="start">The implementation also participates</text><text x="24" y="96.2" font-size="15" fill="#687583" font-weight="400" text-anchor="start">in producing its own evidence.</text><rect x="24" y="139.95" width="312" height="78" rx="5" fill="#F5F8FB" stroke="#D8DFE5"/><text x="180.0" y="169.95" font-size="17" fill="#4C72B0" font-weight="600" text-anchor="middle">Production edit</text><text x="180.0" y="195.95" font-size="15" fill="#687583" font-weight="400" text-anchor="middle">Add underlying flush to write()</text><line x1="180.0" y1="217.95" x2="180.0" y2="246.95" stroke="#4C72B0" stroke-width="1.5" stroke-dasharray=""/><path d="M176.0,245.95 L180.0,251.95 L184.0,245.95" fill="none" stroke="#4C72B0" stroke-width="1.5"/><rect x="24" y="251.95" width="312" height="78" rx="5" fill="#F5F8FB" stroke="#D8DFE5"/><text x="180.0" y="281.95" font-size="17" fill="#B85A5A" font-weight="600" text-anchor="middle">Requested operation</text><text x="180.0" y="307.95" font-size="15" fill="#687583" font-weight="400" text-anchor="middle">Explicit flush still ineffective</text><text x="24" y="361.95" font-size="15" fill="#687583" font-weight="400" text-anchor="start">The same edit also changes evidence:</text><rect x="24" y="382.95" width="312" height="78" rx="5" fill="#F5F8FB" stroke="#D8DFE5"/><text x="180.0" y="412.95" font-size="17" fill="#4C72B0" font-weight="600" text-anchor="middle">Observed witness</text><text x="180.0" y="438.95" font-size="15" fill="#687583" font-weight="400" text-anchor="middle">Writes produce flush events</text><line x1="180.0" y1="460.95" x2="180.0" y2="489.95" stroke="#4C72B0" stroke-width="1.5" stroke-dasharray=""/><path d="M176.0,488.95 L180.0,494.95 L184.0,488.95" fill="none" stroke="#4C72B0" stroke-width="1.5"/><rect x="24" y="494.95" width="312" height="78" rx="5" fill="#F5F8FB" stroke="#D8DFE5"/><text x="180.0" y="524.95" font-size="17" fill="#4C72B0" font-weight="600" text-anchor="middle">Unchanged assertion</text><text x="180.0" y="550.95" font-size="15" fill="#687583" font-weight="400" text-anchor="middle">A flush happened: PASS</text><text x="24" y="602.95" font-size="16" fill="#4C72B0" font-weight="500" text-anchor="start">A true observation does not</text><text x="24" y="626.1500000000001" font-size="16" fill="#4C72B0" font-weight="500" text-anchor="start">automatically establish the</text><text x="24" y="649.3500000000001" font-size="16" fill="#4C72B0" font-weight="500" text-anchor="start">requested operation.</text></g></svg>