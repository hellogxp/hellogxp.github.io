<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <defs>
    <style>
      text { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; fill: #2C3E50; }
      .title { font-size: 20px; font-weight: 600; }
      .lane { font-size: 13px; font-weight: 600; }
      .node { font-size: 12px; font-weight: 600; }
      .small { font-size: 10.5px; fill: #65717c; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#77818a"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" class="title">Production facts, model candidates, and evaluation gold stay separate</text>
  <rect x="28" y="62" width="844" height="132" rx="12" fill="#d0ebff" fill-opacity="0.25" stroke="#AFC9DF"/><text x="48" y="86" class="lane">Production reconstruction</text>
  <g fill="#e7f3fc" stroke="#4C72B0"><rect x="54" y="107" width="132" height="58" rx="9"/><rect x="218" y="107" width="132" height="58" rx="9"/><rect x="382" y="107" width="132" height="58" rx="9"/><rect x="546" y="107" width="132" height="58" rx="9"/><rect x="710" y="107" width="132" height="58" rx="9"/></g>
  <text x="120" y="132" text-anchor="middle" class="node">Existing runs</text><text x="120" y="150" text-anchor="middle" class="small">no takeover</text><text x="284" y="132" text-anchor="middle" class="node">Immutable raw</text><text x="284" y="150" text-anchor="middle" class="small">source identity</text><text x="448" y="132" text-anchor="middle" class="node">Versioned events</text><text x="448" y="150" text-anchor="middle" class="small">supported fields only</text><text x="612" y="132" text-anchor="middle" class="node">Evidence graph</text><text x="612" y="150" text-anchor="middle" class="small">typed relations</text><text x="776" y="132" text-anchor="middle" class="node">Findings</text><text x="776" y="150" text-anchor="middle" class="small">evidence-citing</text>
  <g stroke="#77818a" stroke-width="1.8" marker-end="url(#arrow)"><line x1="186" y1="136" x2="213" y2="136"/><line x1="350" y1="136" x2="377" y2="136"/><line x1="514" y1="136" x2="541" y2="136"/><line x1="678" y1="136" x2="705" y2="136"/></g>
  <rect x="252" y="220" width="620" height="104" rx="12" fill="#d3f9d8" fill-opacity="0.34" stroke="#98C8A3"/><text x="272" y="245" class="lane">Optional model assistance</text>
  <rect x="342" y="262" width="190" height="42" rx="9" fill="#e9f8ec" stroke="#82B890"/><text x="437" y="287" text-anchor="middle" class="node">Minimized evidence view</text><rect x="592" y="262" width="190" height="42" rx="9" fill="#e9f8ec" stroke="#82B890"/><text x="687" y="287" text-anchor="middle" class="node">Inferred candidate</text><line x1="532" y1="283" x2="587" y2="283" stroke="#77818a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 687 262 L 687 205 L 776 205 L 776 170" fill="none" stroke="#82B890" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrow)"/><text x="690" y="193" class="small">cannot overwrite</text>
  <rect x="28" y="350" width="570" height="116" rx="12" fill="#FEF2DD" fill-opacity="0.68" stroke="#E5C58A"/><text x="48" y="375" class="lane">Evaluation only</text>
  <rect x="62" y="397" width="156" height="42" rx="9" fill="#FFF7E8" stroke="#D9AA58"/><text x="140" y="422" text-anchor="middle" class="node">Fault manifest</text><rect x="250" y="397" width="156" height="42" rx="9" fill="#FFF7E8" stroke="#D9AA58"/><text x="328" y="422" text-anchor="middle" class="node">Frozen gold</text><rect x="438" y="397" width="126" height="42" rx="9" fill="#FFF7E8" stroke="#D9AA58"/><text x="501" y="422" text-anchor="middle" class="node">Scorer</text><line x1="218" y1="418" x2="245" y2="418" stroke="#77818a" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="406" y1="418" x2="433" y2="418" stroke="#77818a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 776 170 L 820 343 L 564 418" fill="none" stroke="#D9AA58" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrow)"/><text x="672" y="452" class="small">scores findings; never backfills telemetry</text>
