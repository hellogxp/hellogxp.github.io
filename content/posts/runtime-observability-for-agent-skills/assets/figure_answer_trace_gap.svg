<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="780" height="410" viewBox="0 0 780 410">
  <defs>
    <style>
      text { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; fill: #2C3E50; }
      .title { font-size: 20px; font-weight: 600; }
      .node { font-size: 14px; font-weight: 600; }
      .desc { font-size: 12px; fill: #59636e; }
      .small { font-size: 11px; fill: #7b858f; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#95A5A6"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="390" y="34" text-anchor="middle" class="title">One response, three different claims</text>
  <rect x="35" y="82" width="180" height="90" rx="10" fill="#d0ebff" fill-opacity="0.72" stroke="#4C72B0"/>
  <text x="125" y="116" text-anchor="middle" class="node">Agent response</text><text x="125" y="140" text-anchor="middle" class="desc">“The audit passed.”</text><text x="125" y="158" text-anchor="middle" class="small">What the agent said</text>
  <rect x="300" y="82" width="180" height="90" rx="10" fill="#FEF9E7" stroke="#BDC3C7"/>
  <text x="390" y="116" text-anchor="middle" class="node">Runtime evidence</text><text x="390" y="140" text-anchor="middle" class="desc">Skill, resource, tool, artifact</text><text x="390" y="158" text-anchor="middle" class="small">What the harness exposed</text>
  <rect x="565" y="82" width="180" height="90" rx="10" fill="#d3f9d8" fill-opacity="0.68" stroke="#82B890"/>
  <text x="655" y="116" text-anchor="middle" class="node">Verified outcome</text><text x="655" y="140" text-anchor="middle" class="desc">Independent oracle or test</text><text x="655" y="158" text-anchor="middle" class="small">What actually held</text>
  <line x1="215" y1="127" x2="295" y2="127" stroke="#95A5A6" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/><line x1="480" y1="127" x2="560" y2="127" stroke="#95A5A6" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="255" y="108" text-anchor="middle" class="small">does not prove</text><text x="520" y="108" text-anchor="middle" class="small">does not prove</text>
  <rect x="95" y="232" width="590" height="118" rx="12" fill="#f7f8fa" stroke="#D5DADF"/>
  <text x="390" y="263" text-anchor="middle" class="node">The observability gap</text><text x="390" y="291" text-anchor="middle" class="desc">A plausible answer may follow missed activation, missing resources,</text><text x="390" y="312" text-anchor="middle" class="desc">a failed command, or an unverified artifact.</text><text x="390" y="337" text-anchor="middle" class="small">The missing link is evidence—not another fluent explanation.</text>
</svg>
