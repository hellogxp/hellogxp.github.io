<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450">
  <defs>
    <style>
      text { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; fill: #2C3E50; }
      .title { font-size: 20px; font-weight: 600; }
      .node { font-size: 12px; font-weight: 600; }
      .desc { font-size: 11px; fill: #606b75; }
      .fault { font-size: 11px; fill: #9b4044; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#95A5A6"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" class="title">A Skill run is a chain of boundaries, not one event</text>
  <g>
    <rect x="20" y="90" width="78" height="58" rx="9" fill="#d0ebff" stroke="#4C72B0"/><text x="59" y="124" text-anchor="middle" class="node">Request</text>
    <rect x="134" y="90" width="78" height="58" rx="9" fill="#d0ebff" stroke="#4C72B0"/><text x="173" y="124" text-anchor="middle" class="node">Discovery</text>
    <rect x="248" y="90" width="78" height="58" rx="9" fill="#d0ebff" stroke="#4C72B0"/><text x="287" y="124" text-anchor="middle" class="node">Activation</text>
    <rect x="362" y="90" width="78" height="58" rx="9" fill="#d0ebff" stroke="#4C72B0"/><text x="401" y="124" text-anchor="middle" class="node">Instructions</text>
    <rect x="476" y="90" width="78" height="58" rx="9" fill="#d0ebff" stroke="#4C72B0"/><text x="515" y="124" text-anchor="middle" class="node">Resources</text>
    <rect x="590" y="90" width="78" height="58" rx="9" fill="#d0ebff" stroke="#4C72B0"/><text x="629" y="124" text-anchor="middle" class="node">Execution</text>
    <rect x="704" y="90" width="78" height="58" rx="9" fill="#d0ebff" stroke="#4C72B0"/><text x="743" y="124" text-anchor="middle" class="node">Artifacts</text>
    <rect x="818" y="90" width="78" height="58" rx="9" fill="#d3f9d8" stroke="#82B890"/><text x="857" y="124" text-anchor="middle" class="node">Outcome</text>
    <g stroke="#95A5A6" stroke-width="1.7" marker-end="url(#arrow)"><line x1="98" y1="119" x2="129" y2="119"/><line x1="212" y1="119" x2="243" y2="119"/><line x1="326" y1="119" x2="357" y2="119"/><line x1="440" y1="119" x2="471" y2="119"/><line x1="554" y1="119" x2="585" y2="119"/><line x1="668" y1="119" x2="699" y2="119"/><line x1="782" y1="119" x2="813" y2="119"/></g>
  </g>
  <g stroke="#C44E52" stroke-width="1.3" stroke-dasharray="5,3" fill="#ffe3e3" fill-opacity="0.38"><rect x="130" y="213" width="200" height="62" rx="9"/><rect x="350" y="213" width="200" height="62" rx="9"/><rect x="570" y="213" width="200" height="62" rx="9"/></g>
  <text x="230" y="237" text-anchor="middle" class="fault">Discovered, not activated</text><text x="230" y="257" text-anchor="middle" class="desc">A capability was visible but unused</text>
  <text x="450" y="237" text-anchor="middle" class="fault">Activated, resources missing</text><text x="450" y="257" text-anchor="middle" class="desc">The Skill started incompletely</text>
  <text x="670" y="237" text-anchor="middle" class="fault">Artifact or verifier conflict</text><text x="670" y="257" text-anchor="middle" class="desc">Execution and outcome disagree</text>
  <line x1="287" y1="148" x2="230" y2="208" stroke="#C44E52" stroke-dasharray="5,3"/><line x1="515" y1="148" x2="450" y2="208" stroke="#C44E52" stroke-dasharray="5,3"/><line x1="743" y1="148" x2="670" y2="208" stroke="#C44E52" stroke-dasharray="5,3"/>
  <rect x="100" y="330" width="700" height="68" rx="10" fill="#FEF9E7" stroke="#D8D2B8"/>
  <text x="450" y="357" text-anchor="middle" class="node">A stage can be observed, deterministically related, unsupported, or unknown.</text><text x="450" y="380" text-anchor="middle" class="desc">Absence becomes a failure only when the adapter promised a signal and an independent expectation makes it evaluable.</text>
</svg>
