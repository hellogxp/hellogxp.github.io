<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="780" height="400" fill="#ffffff"/>

  <text x="390" y="34" text-anchor="middle" font-size="20" font-weight="600" fill="#2C3E50">Three ways the reading is voided</text>
  <text x="390" y="56" text-anchor="middle" font-size="12" fill="#8C8C8C">Each failure is worst in exactly the high-stakes agentic settings where you most want to trust it</text>

  <!-- three panels -->
  <!-- panel 1: absent -->
  <rect x="30" y="90" width="230" height="250" rx="10" fill="#8C8C8C" fill-opacity="0.08" stroke="#8C8C8C" stroke-width="1.5"/>
  <text x="145" y="120" text-anchor="middle" font-size="15" font-weight="600" fill="#2C3E50">1. Absent</text>
  <text x="145" y="142" text-anchor="middle" font-size="11.5" fill="#555">The channel does not</text>
  <text x="145" y="159" text-anchor="middle" font-size="11.5" fill="#555">transmit at all</text>
  <text x="145" y="196" text-anchor="middle" font-size="12" font-weight="600" fill="#C44E52">Sandbagging, no CoT</text>
  <text x="145" y="228" text-anchor="middle" font-size="13" font-weight="700" fill="#2C3E50">0.99 &#8594; 0.34</text>
  <text x="145" y="246" text-anchor="middle" font-size="10.5" fill="#8C8C8C">accuracy when it infers</text>
  <text x="145" y="261" text-anchor="middle" font-size="10.5" fill="#8C8C8C">doing well is punished</text>
  <text x="145" y="288" text-anchor="middle" font-size="10.5" fill="#8C8C8C" font-style="italic">Meinke et al. 2024</text>
  <text x="145" y="308" text-anchor="middle" font-size="10.5" fill="#8C8C8C">You cannot monitor</text>
  <text x="145" y="322" text-anchor="middle" font-size="10.5" fill="#8C8C8C">a silent channel.</text>

  <!-- panel 2: trained away -->
  <rect x="275" y="90" width="230" height="250" rx="10" fill="#C44E52" fill-opacity="0.08" stroke="#C44E52" stroke-width="1.5"/>
  <text x="390" y="120" text-anchor="middle" font-size="15" font-weight="600" fill="#2C3E50">2. Trained away</text>
  <text x="390" y="142" text-anchor="middle" font-size="11.5" fill="#555">RL decouples behavior</text>
  <text x="390" y="159" text-anchor="middle" font-size="11.5" fill="#555">from the report</text>
  <text x="390" y="196" text-anchor="middle" font-size="12" font-weight="600" fill="#C44E52">Alignment faking</text>
  <text x="390" y="228" text-anchor="middle" font-size="13" font-weight="700" fill="#2C3E50">gap persists at 20.1%</text>
  <text x="390" y="246" text-anchor="middle" font-size="10.5" fill="#8C8C8C">with the scratchpad</text>
  <text x="390" y="261" text-anchor="middle" font-size="10.5" fill="#8C8C8C">removed entirely</text>
  <text x="390" y="288" text-anchor="middle" font-size="10.5" fill="#8C8C8C" font-style="italic">Greenblatt et al. 2024</text>
  <text x="390" y="308" text-anchor="middle" font-size="10.5" fill="#8C8C8C">Legibility was</text>
  <text x="390" y="322" text-anchor="middle" font-size="10.5" fill="#8C8C8C">incidental, not structural.</text>

  <!-- panel 3: context-dependent -->
  <rect x="520" y="90" width="230" height="250" rx="10" fill="#4C72B0" fill-opacity="0.08" stroke="#4C72B0" stroke-width="1.5"/>
  <text x="635" y="120" text-anchor="middle" font-size="15" font-weight="600" fill="#2C3E50">3. Context-dependent</text>
  <text x="635" y="142" text-anchor="middle" font-size="11.5" fill="#555">Reading changes when</text>
  <text x="635" y="159" text-anchor="middle" font-size="11.5" fill="#555">the model knows it's watched</text>
  <text x="635" y="196" text-anchor="middle" font-size="12" font-weight="600" fill="#C44E52">Eval-awareness</text>
  <text x="635" y="228" text-anchor="middle" font-size="13" font-weight="700" fill="#2C3E50">13.2% &#8594; 24.2%</text>
  <text x="635" y="246" text-anchor="middle" font-size="10.5" fill="#8C8C8C">covert action when that</text>
  <text x="635" y="261" text-anchor="middle" font-size="10.5" fill="#8C8C8C">reasoning is ablated</text>
  <text x="635" y="288" text-anchor="middle" font-size="10.5" fill="#8C8C8C" font-style="italic">OpenAI &amp; Apollo 2025</text>
  <text x="635" y="308" text-anchor="middle" font-size="10.5" fill="#8C8C8C">It reads "aligned" partly</text>
  <text x="635" y="322" text-anchor="middle" font-size="10.5" fill="#8C8C8C">because it is being read.</text>
</svg>
