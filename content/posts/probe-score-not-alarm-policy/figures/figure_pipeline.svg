<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="400" viewBox="0 0 980 400">
  <defs>
    <style>
      text { font-family: "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif; }
      .overline { font-size: 12px; font-weight: 600; letter-spacing: 3px; fill: #8C8C8C; }
      .step { font-size: 15px; font-weight: 600; fill: #2C3E50; }
      .sub { font-size: 10.5px; fill: #8C8C8C; }
      .badge { font-size: 10px; font-weight: 700; fill: #FFFFFF; }
      .takeaway { font-size: 13.5px; font-weight: 600; fill: #2C3E50; }
      .note { font-size: 11px; fill: #8C8C8C; }
      .abstain { font-size: 12.5px; font-weight: 600; fill: #C44E52; }
    </style>
    <marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#2C3E50"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#C44E52"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <text x="490" y="40" text-anchor="middle" class="overline">THE ROAD FROM A SCORE TO AN ALARM</text>

  <!-- step 1 -->
  <rect x="16" y="80" width="162" height="92" rx="10" fill="#FFFFFF" stroke="#BDC3C7" stroke-width="1"/>
  <text x="97" y="120" text-anchor="middle" class="step">1. Specify</text>
  <text x="97" y="142" text-anchor="middle" class="sub">target, unit, horizon</text>

  <line x1="179" y1="126" x2="213" y2="126" stroke="#2C3E50" stroke-width="2" marker-end="url(#arr)"/>

  <!-- step 2 (highlighted: AUROC lives here) -->
  <rect x="214" y="80" width="162" height="92" rx="10" fill="#EAF1FA" stroke="#4C72B0" stroke-width="1.5"/>
  <rect x="235" y="88" width="120" height="20" rx="10" fill="#4C72B0"/>
  <text x="295" y="102" text-anchor="middle" class="badge">AUROC 0.92 ✓</text>
  <text x="295" y="133" text-anchor="middle" class="step">2. Compare</text>
  <text x="295" y="154" text-anchor="middle" class="sub">vs same-horizon baseline</text>

  <line x1="377" y1="126" x2="411" y2="126" stroke="#2C3E50" stroke-width="2" marker-end="url(#arr)"/>

  <!-- step 3 -->
  <rect x="412" y="80" width="162" height="92" rx="10" fill="#FFFFFF" stroke="#BDC3C7" stroke-width="1"/>
  <text x="493" y="120" text-anchor="middle" class="step">3. Calibrate</text>
  <text x="493" y="142" text-anchor="middle" class="sub">lock the threshold</text>

  <line x1="575" y1="126" x2="609" y2="126" stroke="#2C3E50" stroke-width="2" marker-end="url(#arr)"/>

  <!-- step 4 -->
  <rect x="610" y="80" width="162" height="92" rx="10" fill="#FFFFFF" stroke="#BDC3C7" stroke-width="1"/>
  <text x="691" y="120" text-anchor="middle" class="step">4. Stress</text>
  <text x="691" y="142" text-anchor="middle" class="sub">transport &amp; groups</text>

  <line x1="773" y1="126" x2="807" y2="126" stroke="#2C3E50" stroke-width="2" marker-end="url(#arr)"/>

  <!-- step 5 -->
  <rect x="808" y="80" width="162" height="92" rx="10" fill="#FFFFFF" stroke="#BDC3C7" stroke-width="1"/>
  <text x="889" y="120" text-anchor="middle" class="step">5. Claim</text>
  <text x="889" y="142" text-anchor="middle" class="sub">what you may say</text>

  <!-- where monitors die: bracket under steps 3-4 -->
  <path d="M412,196 L412,208 L772,208 L772,196" fill="none" stroke="#C44E52" stroke-width="1.5"/>
  <text x="592" y="232" text-anchor="middle" class="abstain">where good monitors die</text>
  <text x="592" y="252" text-anchor="middle" class="note">too few negatives to lock a threshold · a tail that doesn't separate · calibration that doesn't transport</text>

  <!-- abstain branch -->
  <line x1="493" y1="172" x2="493" y2="300" stroke="#C44E52" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr-red)"/>
  <rect x="385" y="306" width="216" height="40" rx="8" fill="#FDF2F2" stroke="#C44E52" stroke-width="1"/>
  <text x="493" y="331" text-anchor="middle" class="abstain">Abstain — fail closed</text>

  <!-- takeaway -->
  <text x="490" y="382" text-anchor="middle" class="takeaway">A high AUROC is evidence at step 2. It is not permission to skip 3, 4, and 5.</text>
</svg>
