<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="440" viewBox="0 0 920 440">
  <defs>
    <style>
      text { font-family: "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif; }
      .overline { font-size: 12px; font-weight: 600; letter-spacing: 3px; fill: #8C8C8C; }
      .card-head { font-size: 11px; font-weight: 600; letter-spacing: 2px; fill: #8C8C8C; }
      .card-title { font-size: 19px; font-weight: 600; fill: #2C3E50; }
      .bignum-blue { font-size: 56px; font-weight: 700; fill: #4C72B0; }
      .bignum-red { font-size: 56px; font-weight: 700; fill: #C44E52; }
      .numlabel { font-size: 12px; fill: #8C8C8C; }
      .row { font-size: 12.5px; fill: #2C3E50; }
      .stamp-pass { font-size: 12px; font-weight: 700; letter-spacing: 2px; fill: #2b8a3e; }
      .stamp-fail { font-size: 12px; font-weight: 700; letter-spacing: 2px; fill: #C44E52; }
      .arrow-label { font-size: 11px; font-style: italic; fill: #8C8C8C; }
    </style>
    <marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#2C3E50"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <text x="460" y="44" text-anchor="middle" class="overline">THE SAME MONITOR, GRADED TWICE</text>

  <!-- ============ LEFT CARD: lab report ============ -->
  <rect x="50" y="70" width="380" height="320" rx="10" fill="#FFFFFF" stroke="#BDC3C7" stroke-width="1"/>
  <text x="82" y="112" class="card-head">LAB REPORT</text>
  <text x="82" y="142" class="card-title">Ranking quality</text>

  <text x="82" y="222" class="bignum-blue">0.92</text>
  <text x="228" y="222" class="numlabel">AUROC</text>
  <text x="82" y="248" class="numlabel">attacks outrank safe cases in 92% of pairs</text>

  <line x1="82" y1="276" x2="398" y2="276" stroke="#E4E7EB" stroke-width="1"/>

  <circle cx="94" cy="304" r="7" fill="none" stroke="#2b8a3e" stroke-width="1.5"/>
  <polyline points="90,304 93,307 99,300" fill="none" stroke="#2b8a3e" stroke-width="1.8" stroke-linecap="round"/>
  <text x="112" y="308" class="row">ranks attacks above safe cases</text>

  <circle cx="94" cy="334" r="7" fill="none" stroke="#2b8a3e" stroke-width="1.5"/>
  <polyline points="90,334 93,337 99,330" fill="none" stroke="#2b8a3e" stroke-width="1.8" stroke-linecap="round"/>
  <text x="112" y="338" class="row">the metric the literature reports</text>

  <!-- PASS stamp -->
  <g transform="rotate(-8 352 336)">
    <rect x="312" y="318" width="80" height="34" rx="5" fill="none" stroke="#2b8a3e" stroke-width="2"/>
    <text x="352" y="341" text-anchor="middle" class="stamp-pass">PASS</text>
  </g>

  <!-- deploy arrow -->
  <line x1="438" y1="230" x2="482" y2="230" stroke="#2C3E50" stroke-width="2" marker-end="url(#arr)"/>
  <text x="460" y="214" text-anchor="middle" class="arrow-label">deploy</text>

  <!-- ============ RIGHT CARD: deployment report ============ -->
  <rect x="490" y="70" width="380" height="320" rx="10" fill="#FFFFFF" stroke="#BDC3C7" stroke-width="1"/>
  <text x="522" y="112" class="card-head">DEPLOYMENT REPORT</text>
  <text x="522" y="142" class="card-title">Alarm performance</text>

  <text x="522" y="222" class="bignum-red">0 / 38</text>
  <text x="522" y="248" class="numlabel">attacks detected at the locked 5% false-alarm budget</text>

  <line x1="522" y1="276" x2="838" y2="276" stroke="#E4E7EB" stroke-width="1"/>

  <circle cx="534" cy="304" r="7" fill="none" stroke="#C44E52" stroke-width="1.5"/>
  <line x1="529.5" y1="299.5" x2="538.5" y2="308.5" stroke="#C44E52" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="538.5" y1="299.5" x2="529.5" y2="308.5" stroke="#C44E52" stroke-width="1.8" stroke-linecap="round"/>
  <text x="552" y="308" class="row">nothing crosses the locked threshold</text>

  <circle cx="534" cy="334" r="7" fill="none" stroke="#C44E52" stroke-width="1.5"/>
  <line x1="529.5" y1="329.5" x2="538.5" y2="338.5" stroke="#C44E52" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="538.5" y1="329.5" x2="529.5" y2="338.5" stroke="#C44E52" stroke-width="1.8" stroke-linecap="round"/>
  <text x="552" y="338" class="row">38 attack cases slip through</text>

  <!-- SILENT stamp -->
  <g transform="rotate(-8 792 336)">
    <rect x="748" y="318" width="88" height="34" rx="5" fill="none" stroke="#C44E52" stroke-width="2"/>
    <text x="792" y="341" text-anchor="middle" class="stamp-fail">SILENT</text>
  </g>
</svg>
